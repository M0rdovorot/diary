version: "3.9"

networks:
  internal:
    driver: bridge

volumes:
  ollama_data:
  whisper_cache:

services:
  # --- Распознавание речи (STT) ---
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whisper
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: small          # base | small | medium — при нехватке RAM переключить на base
      ASR_MODEL_PATH: /data/models
    volumes:
      - whisper_cache:/data/models
    networks:
      - internal
    # Порт наружу не открываем — доступ только из docker-сети (от бота)
    deploy:
      resources:
        limits:
          memory: 2.5G

  # --- Локальная LLM для саммаризации ---
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 4.5G

